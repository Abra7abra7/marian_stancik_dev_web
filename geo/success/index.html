<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Order Confirmed — Marian Stancik</title>
<style>
body{font-family:Inter,sans-serif;background:radial-gradient(ellipse 90% 55% at 50% 0%, #122238 0%, #0A111C 45%, #060B12 100%) no-repeat fixed;background-color:#0A111C;color:#E8EEF5;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0;}
.card{background:rgba(14,25,42,0.72);border:1px solid rgba(162,123,80,0.18);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:18px;padding:48px;max-width:480px;text-align:center;margin:20px;box-shadow:0 12px 40px rgba(0,0,0,0.5);}
h1{color:#EBC37D;font-size:28px;}
.check{font-size:64px;margin-bottom:10px;}
.note{color:#8B9EB7;font-size:14px;line-height:1.6;}
.btn{display:inline-block;margin-top:20px;padding:12px 32px;background:linear-gradient(135deg,#CD7F32,#EBC37D);color:#080E18;text-decoration:none;border-radius:8px;font-weight:700;}
</style>
<script defer src="/js/posthog.js?v=consent1"></script>
</head>
<body>
<div class="card" id="main-card">
<div class="check">✅</div>
<h1>Order Confirmed!</h1>
<p id="status-text">Your order is being processed.</p>
<p class="note" id="detail-text">You'll receive the PDF report within 48 hours.</p>
<a href="https://marianstancik.dev" class="btn">← Back to Home</a>
</div>
<script>
const params = new URLSearchParams(window.location.search);
const oid = params.get('order_id');
if (oid) {
  document.getElementById('status-text').textContent = 'Order #' + oid.slice(0,8) + ' confirmed!';
  document.getElementById('detail-text').innerHTML = 'Your GEO audit will arrive at your inbox within <strong>48 hours</strong>.';
}
</script>
</body>
</html>
